name: Build AxM-Next

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        type: choice
        options:
          - Debug
          - Release
        default: Debug
      publish:
        description: Publish a GitHub release (requires Release and valid signing secrets)
        type: boolean
        default: false
      tag:
        description: Release tag used when publishing
        type: string
        default: v1.1

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Validate inputs
        if: ${{ inputs.publish && inputs.build_type != 'Release' }}
        run: |
          echo "::error::publishing requires build_type=Release"
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          valid=0
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS" 2>/dev/null || true
            if keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              valid=1
            fi
          fi
          if [ "$valid" = 1 ]; then
            SP="$KEYSTORE_PASSWORD"
            KA="$KEY_ALIAS"
            KP="$KEY_PASSWORD"
          else
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::publishing needs valid signing secrets (KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
              exit 1
            fi
            echo "::warning::signing secrets are missing or invalid, using a temporary random keystore"
            rm -f "$KS"
            SP="$(openssl rand -hex 16)"
            KA="ax"
            KP="$SP"
            echo "::add-mask::$SP"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KA" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$SP" -keypass "$KP" -dname "CN=AxM-Next"
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "signing.storeFile=$KS"
            echo "signing.storePassword=$SP"
            echo "signing.keyAlias=$KA"
            echo "signing.keyPassword=$KP"
          } > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :manager:assemble${{ inputs.build_type }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AxM-Next-apk
          path: manager/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          apk="$(ls manager/build/outputs/apk/release/*.apk | head -n 1)"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          gh release create "$TAG" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "AxM-Next $TAG" \
            --notes-file .github/release-notes.md
